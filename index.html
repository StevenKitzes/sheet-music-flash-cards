<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sheet Music Flash Cards</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page" id="page">
      <div class="header">
        <div class="mode-toggle" role="radiogroup" aria-label="Mode">
          <input type="radio" name="mode" id="mode-guess" /><label for="mode-guess">Guess</label>
          <input type="radio" name="mode" id="mode-find" /><label for="mode-find">Find</label>
        </div>
        <a class="header-button" href="mode-help.html" aria-label="How it works">?</a>
        <button type="button" class="header-button" id="open-settings" aria-label="Settings">&#9881;&#xFE0E;</button>
        <div class="streak" id="streak" title="Streak" aria-live="polite" hidden>
          <span class="streak-flame" aria-hidden="true">🔥</span><span id="streak-count">0</span>
        </div>
      </div>

      <div class="bar" id="bar">
        <div class="note-name-display name-ready" id="note-name-display">Ready?</div>
        <div class="staff" id="staff-inner">
          <div class="bar-display"></div>
          <div class="bar-display"><div class="show-ledger"></div></div>
          <div class="bar-display"></div>
          <div class="bar-display"><div class="show-ledger"></div></div>
          <div class="bar-display"></div>
          <div class="bar-display"><div class="show-ledger"></div></div>
          <div class="bar-display"></div>
          <div class="bar-display bar-lower-line"></div>
          <div class="bar-display bar-sided"></div>
          <div class="bar-display bar-sided bar-lower-line"></div>
          <div class="bar-display bar-sided"></div>
          <div class="bar-display bar-sided bar-lower-line"></div>
          <div class="bar-display bar-sided"></div>
          <div class="bar-display bar-sided bar-lower-line"></div>
          <div class="bar-display bar-sided"></div>
          <div class="bar-display bar-sided bar-lower-line"></div>
          <div class="bar-display"></div>
          <div class="bar-display"><div class="show-ledger"></div></div>
          <div class="bar-display"></div>
          <div class="bar-display"><div class="show-ledger"></div></div>
          <div class="bar-display"></div>
          <div class="bar-display"><div class="show-ledger"></div></div>
          <div class="bar-display"></div>
          <div class="bar-display"></div>
        </div>
      </div>

      <div class="fret-positions" id="fret-positions"></div>

      <div class="footer">
        A cute li'l project by&nbsp;<a href="https://github.com/stevenkitzes"><strong>Steven Kitzes</strong></a>
      </div>
    </div>

    <div class="settings-panel" id="settings-panel" hidden>
      <div class="settings-content">
        <div class="settings-header">
          <h3>Settings</h3>
          <button type="button" class="done-button" id="close-settings">Done</button>
        </div>

        <div class="settings-label">Include these notes:</div>
        <div class="settings-row">
          <label class="checkbox-label"><input id="upper" type="checkbox" /> Upper</label>
          <label class="checkbox-label"><input id="staff" type="checkbox" /> Staff</label>
          <label class="checkbox-label"><input id="lower" type="checkbox" /> Lower</label>
        </div>

        <div class="settings-row settings-row-labeled">
          <label class="settings-label" for="key">Key:</label>
          <select id="key"></select>
        </div>

        <div class="settings-label">Note accidentals:</div>
        <div class="settings-row">
          <label class="checkbox-label"><input id="sharps" type="checkbox" /> Sharp &#9839;</label>
          <label class="checkbox-label"><input id="flats" type="checkbox" /> Flat &#9837;</label>
          <label class="checkbox-label"><input id="naturals" type="checkbox" /> Natural &#9838;</label>
        </div>
        <div class="settings-hint">Naturals only appear in keys other than C, on notes the key signature changes.</div>

        <div class="settings-row settings-row-labeled">
          <span class="settings-label">Seconds:</span>
          <label>Card <input type="text" inputmode="decimal" id="time" class="small-input" aria-label="Card seconds" /></label>
          <label>Review <input type="text" inputmode="decimal" id="review-time" class="small-input" aria-label="Review seconds" /></label>
        </div>

        <div class="settings-row settings-row-labeled">
          <span class="settings-label">Guitar frets:</span>
          <label class="checkbox-label">Show: <input id="guitar-hints" type="checkbox" /></label>
        </div>
        <div class="settings-row">
          <label>Max fret <select id="max-fret">
            <option value="12">12</option>
            <option value="17" selected>17</option>
          </select></label>
        </div>
        <div class="settings-row">
          <label>Show frets <input type="number" inputmode="numeric" id="fret-from" min="0" class="small-input" /></label>
          <label>to <input type="number" inputmode="numeric" id="fret-to" min="0" class="small-input" /></label>
        </div>
        <div class="settings-error" id="fret-error" role="alert" hidden></div>

        <div id="best-streak-section">
          <div class="settings-row settings-row-labeled">
            <span class="settings-label">Best streak:</span>
            <span class="best-streak"><span aria-hidden="true">🔥</span> <span id="best-streak">0</span></span>
            <button type="button" class="reset-streak-button" id="reset-streak" aria-label="Reset streak">Reset</button>
          </div>
        </div>

        <div class="settings-row">
          <button type="button" class="wake-button" id="wake-lock" aria-pressed="false">Keep screen awake: Off</button>
        </div>
      </div>
    </div>

    <script type="text/javascript" src="notes.js"></script>
    <script type="text/javascript" src="main.js"></script>
  </body>
</html>
